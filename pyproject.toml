[project]
name = "phishing-corpus-contract"
version = "0.1.0"
description = "Offline corpus contract tooling for phishing email samples"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
phishing-contract = "phishing_contract.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishing_contract"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "FBT001", "FBT002", "FIX002", "ISC001", "TD002", "TD003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR0913", "PLR0917", "PLR2004", "S101", "SLF001"]
# regression/ is a standalone dev harness (not part of the src/tests gate).
"regression/**/*.py" = ["C901", "D", "EM", "PLR", "PT", "S", "T20", "TRY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
