schema_version = 1

# --- Seed categories (pilot) -------------------------------------------------

[[category]]
id = "account-signin-alert"
bucket = "account-security"
description = "Account security / unusual sign-in alerts harvesting credentials"
action = "quarantine"
priority = 30
acceptance = [10, 1001]

[[category.rules]]
field = "subject"
op = "regex"
value = "(?i)unusual signin"

[[category]]
id = "crypto-wallet-verification"
bucket = "crypto"
description = "Wallet / asset access verification lures targeting crypto holders"
action = "quarantine"
priority = 30
acceptance = [1014]

[[category.rules]]
field = "subject"
op = "regex"
value = "(?i)unauthorized (access|transaction)"

[[category]]
id = "points-expiry"
bucket = "rewards-promotions"
description = "Loyalty / bank points expiry lures (Livelo and similar)"
action = "quarantine"
priority = 30
acceptance = [1, 1050]

[[category.rules]]
field = "subject"
op = "regex"
value = "(?i)pontos.{0,80}expir"

[[category]]
id = "investment-lure"
bucket = "financial"
description = "Investment proposition lures, often RE: reply chains"
action = "flag"
priority = 30
acceptance = [406]

[[category.rules]]
field = "subject"
op = "regex"
value = "(?i)investment proposition"

# --- v2: from pilot dossiers --------------------------------------------------

[[category]]
id = "customs-package-hold"
