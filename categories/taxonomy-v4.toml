[[category.signals]]
field = "body_evidence"
op = "regex"
value = "(?i)(package|delivery|correios|customs|import|taxa|shipment|pedido|tracking)"

[[category]]
id = "government-legal-residual"
bucket = "government-legal"
description = "Broad government, legal, tax-agency, and law-enforcement lures"
action = "quarantine"
priority = 20
min_signals = 2
acceptance = []

[[category.signals]]
