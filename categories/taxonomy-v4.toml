# --- v4: bucket-level residual categories -----------------------------------

[[category]]
id = "account-security-residual"
bucket = "account-security"
description = "Broad account-security lures that do not match a named subtype"
action = "quarantine"
priority = 20
min_signals = 2
acceptance = []

[[category.signals]]
field = "subject"
op = "regex"
value = "(?i)(account|login|password|verification|verify|security|unusual|suspicious|device|blocked)"

[[category.signals]]
field = "body_evidence"
op = "regex"
value = "(?i)(account|login|password|verify|verification|security|suspended|unauthorized)"

[[category]]
id = "crypto-residual"
bucket = "crypto"
description = "Broad crypto wallet, token, staking, and airdrop lures"
action = "quarantine"
priority = 20
min_signals = 2
acceptance = []

[[category.signals]]
field = "subject"
op = "regex"
value = "(?i)(crypto|wallet|ledger|metamask|staking|airdrop|bitcoin|btc|ethereum|token)"

[[category.signals]]
field = "body_evidence"
op = "regex"
value = "(?i)(crypto|wallet|ledger|metamask|staking|airdrop|bitcoin|btc|ethereum|token)"

[[category]]
id = "financial-residual"
bucket = "financial"
