# Taxonomy v5 — round 5 (fm/interview-round5).
#
# Design rules honored here:
# * Multiple rules in one category are AND'd (all must match); alternatives
#   are expressed as regex alternation inside a single rule.
# * Heterogeneous lure families use signals with min_signals (OR-count
#   semantics) instead of many AND'd rules.
# * Text is folded (casefold + lookalike normalization) before matching, so
#   regexes are case-insensitive by construction and accented variants are
#   written explicitly (fold does not strip accents).
# * Priorities: subtypes 30 (customs 29), direct-marketing 25, residuals 20,
#   attachment-led 15, stylized-unicode technique 10, catch-all 5.

schema_version = 1

# --- Account security ---------------------------------------------------------

[[category]]
id = "account-signin-alert"
type = "credential-harvesting"
family = "credential"
display = "credential-harvesting/credential"
rubric = "Account 'you recently signed in' alerts, including unicode-obfuscated brand lures. Subject carries a sign-in/login/security-alert frame with a brand or case marker; body pushes a verification link."
bucket = "account-security"
description = "Account security / unusual sign-in alerts harvesting credentials"
action = "quarantine"
priority = 31
acceptance = [10, 1001, 7218]

[[category.rules]]
field = "subject"
op = "regex"
value = '(unusual sign[ -]?in|novo acesso|acesso a sua conta|(de-?activat\w*|suspend\w*) request)'

[[category]]
id = "crypto-wallet-verification"
type = "crypto-asset"
family = "wallet"
display = "crypto-asset/wallet"
rubric = "Crypto wallet / asset-account verification lures demanding a code or KYC (Trust Wallet, MetaMask, suspended-wallet threats). Subject pairs wallet/account language with suspension or verification threats."
bucket = "crypto"
description = "Wallet / asset access verification lures targeting crypto holders"
action = "quarantine"
priority = 31
acceptance = [1014, 1110, 4874, 7576]

[[category.rules]]
field = "subject"
op = "regex"
value = '(unauthorized (access|transaction)|wallet\w* (was|has been) suspend|wallet\w* (is still )?pending verification|verify your wallet.{0,40}(suspend\w*|suspens\w*|kyc)|trust wallet|\bkyc\b|unverified)'

[[category]]
id = "login-alert-obfuscated"
type = "credential-harvesting"
family = "credential"
display = "credential-harvesting/credential"
rubric = "Sign-in alerts whose subject uses stylized or obfuscated brand text (math/lookalike characters). subject_math_stylized is true and the subject reads as a login/security alert."
bucket = "account-security"
description = "Login activity alerts with obfuscated / lookalike styling"
action = "quarantine"
priority = 31
acceptance = [26]

[[category.rules]]
field = "subject"
op = "regex"
value = 'tried to [1li]og in'

[[category]]
id = "account-verification"
type = "credential-harvesting"
family = "credential"
display = "credential-harvesting/credential"
rubric = "Generic account verification / KYC completion lures (no brand, no wallet). Subject demands verification or identification; body mentions verification, KYC or authentication."
bucket = "account-security"
description = "KYC / identity verification lures impersonating service providers"
action = "quarantine"
priority = 31
acceptance = [924, 990, 718]

[[category.rules]]
field = "subject"
op = "regex"
value = '(account verification required|urgent update required|update required|verify your account|identificatie|identify yourself)'

[[category.rules]]
field = "body_evidence"
op = "regex"
value = '(kyc|verif\w*|balance confirmation|corporate access|identif\w*|authentication)'

[[category]]
id = "device-access-alert"
type = "credential-harvesting"
family = "credential"
display = "credential-harvesting/credential"
rubric = "New-device / new-app access alerts on accounts. Subject announces device or app access; body continues the alert with a confirm/review link."
bucket = "account-security"
description = "New device access alerts"
action = "quarantine"
priority = 32
acceptance = [1111, 1317]

[[category.rules]]
field = "subject"
op = "regex"
value = 'novo dispositivo'

[[category]]
id = "photos-deletion-alert"
type = "credential-harvesting"
family = "credential"
display = "credential-harvesting/credential"
rubric = "Photo/video deletion threats (Google Photos, iCloud, Facebook styles, ES/PT/EN). Subject threatens deletion of stored media or account closure."
bucket = "account-security"
description = "Cloud photo / video deletion and account-closure threats"
action = "quarantine"
priority = 31
acceptance = [6161, 2866]

[[category.rules]]
field = "subject"
op = "regex"
value = '(photos and videos will be deleted|photos? will be deleted|account access is at risk|photos? (and|&) videos? deleted|account\w* (in danger of closure|will be blocked)|deleting your (account )?photos|fotos.{0,30}elimina\w*|foto\w*.{0,30}verwijderd|account misbruik)'

